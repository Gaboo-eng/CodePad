<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodePad: bloc de notas técnico y portal de apuntes de programación. Inicia sesión para acceder a tus proyectos, notas y recordatorios.">
  <meta name="author" content="gaboo-eng">
  <title>Iniciar sesión | CodePad</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/login.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('codepad-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* Sin acceso a localStorage */ }
    })();
  </script>
</head>
<body>
  <main class="login-page">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema de color" aria-pressed="false">
      <span aria-hidden="true">◐</span>
      <span id="theme-toggle-label">Tema</span>
    </button>

    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <img src="./assets/logo.svg" alt="Logotipo de CodePad" class="login-logo" width="72" height="72">
        <h1 id="login-title" class="login-title">CodePad</h1>
        <p class="login-subtitle">Bloc de notas técnico y portal de apuntes de programación</p>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        </div>

        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>

        <button type="submit" id="login-submit" class="btn-primary">Iniciar sesión</button>
      </form>

      <p class="login-recovery-link"><a href="./restablecer-contrasena.html">¿Olvidaste tu contraseña?</a></p>
      <p class="login-footer">Acceso seguro con Firebase Authentication</p>
    </section>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
